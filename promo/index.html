<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>إعلانات صوت الأحزان</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #121212; color: #f2f2f2; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: #D4AF37; }
  p.sub { margin: 0 0 24px; color: #9a9a9a; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .card { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 14px; padding: 12px; }
  .card h2 { font-size: 16px; margin: 4px 4px 2px; }
  .card .note { font-size: 13px; color: #9a9a9a; margin: 0 4px 10px; }
  video { width: 100%; max-height: 420px; border-radius: 10px; background: #000; display: block; }
  a.dl { display: block; margin-top: 10px; text-align: center; background: #D4AF37; color: #121212; font-weight: 700;
         text-decoration: none; padding: 12px; border-radius: 999px; }
</style>
</head>
<body>
<main>
  <h1>إعلانات صوت الأحزان</h1>
  <p class="sub">اضغط «تحميل» لحفظ الفيديو على جهازك.</p>

      <p class="note">للستوري والريلز وتيك توك · <span dir="ltr">1080×1920</span></p>
      <video src="sawt-alahzan-promo.mp4" poster="sawt-alahzan-promo.jpg" controls playsinline preload="metadata"></video>
      <a class="dl" href="sawt-alahzan-promo.mp4" download>تحميل</a>
    </div>
    <div class="card">
      <h2>مربع، بالموسيقى</h2>

      <video src="sawt-alahzan-promo-square.mp4" poster="sawt-alahzan-promo-square.jpg" controls playsinline preload="metadata"></video>
      <a class="dl" href="sawt-alahzan-promo-square.mp4" download>تحميل</a>
    </div>
    <div class="card">
      <h2>عمودي، مؤثرات فقط</h2>
      <p class="note">بدون موسيقى · <span dir="ltr">1080×1920</span></p>
      <video src="sawt-alahzan-promo-effects.mp4" poster="sawt-alahzan-promo-effects.jpg" controls playsinline preload="metadata"></video>
      <a class="dl" href="sawt-alahzan-promo-effects.mp4" download>تحميل</a>
    </div>
    <div class="card">
      <h2>مربع، مؤثرات فقط</h2>
      <p class="note">بدون موسيقى · <span dir="ltr">1080×1080</span></p>
      <video src="sawt-alahzan-promo-square-effects.mp4" poster="sawt-alahzan-promo-square-effects.jpg" controls playsinline preload="metadata"></video>
      <a class="dl" href="sawt-alahzan-promo-square-effects.mp4" download>تحميل</a>
    </div>
  </div>
</main>
</body>
</html>
